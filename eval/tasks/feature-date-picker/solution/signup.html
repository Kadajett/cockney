<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your Acme account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <form id="signup-form" action="/api/signup" method="post" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
        <p class="error" id="name-error" hidden></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <p class="error" id="email-error" hidden></p>
      </div>
      <div class="field">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" name="dob" autocomplete="bday" required>
        <p class="error" id="dob-error" hidden></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        <p class="error" id="password-error" hidden></p>
      </div>
      <button type="submit">Sign up</button>
    </form>
  </main>
  <script src="signup.js"></script>
</body>
</html>
